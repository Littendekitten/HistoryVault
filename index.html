<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HistoryVault - By KitaCat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
        <div class="glass-box auth-box">
            <h1>🏛️ HistoryVault</h1>
            <p>The Collaborative History Wiki</p>
            <span class="credit">By KitaCat</span>
            <button id="login-btn" class="primary-btn mt-20">Login / Sign Up with Google</button>
        </div>
    </div>

    <!-- First Time Setup Screen -->
    <div id="setup-screen" class="screen hidden">
        <div class="glass-box modal-box">
            <h2>Welcome to HistoryVault!</h2>
            <p>Customize your profile to get started.</p>
            <input type="text" id="setup-username" placeholder="Choose a username..." class="modern-input">
            <label for="setup-color" class="color-label">Your Theme Color:</label>
            <input type="color" id="setup-color" value="#6366f1" class="modern-color-picker">
            <button id="setup-save-btn" class="primary-btn">Complete Setup</button>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen hidden">
        <header class="glass-header">
            <div class="header-left">
                <h1>🏛️ HistoryVault</h1>
            </div>
            <div class="header-right">
                <span id="user-display"></span>
                <button id="settings-btn" class="icon-btn">⚙️</button>
                <button id="logout-btn" class="icon-btn">🚪</button>
            </div>
        </header>

        <main>
            <!-- Navigation Breadcrumbs -->
            <nav id="breadcrumbs" class="breadcrumbs hidden">
                <span id="nav-home" class="nav-link">Topics</span>
                <span id="nav-topic-divider" class="hidden"> / </span>
                <span id="nav-topic" class="nav-link hidden">Topic Name</span>
                <span id="nav-subtopic-divider" class="hidden"> / </span>
                <span id="nav-subtopic" class="nav-current hidden">Subtopic Name</span>
            </nav>

            <!-- Topics View -->
            <section id="topics-view" class="view-section">
                <div class="section-header">
                    <h2>📚 All Topics</h2>
                    <form id="create-topic-form" class="modern-form">
                        <input type="text" id="new-topic-name" placeholder="Create a new topic..." required class="modern-input">
                        <button type="submit" class="primary-btn">+</button>
                    </form>
                </div>
                <div id="topics-list" class="grid"></div>
            </section>

            <!-- Subtopics View -->
            <section id="subtopics-view" class="view-section hidden">
                <div class="section-header">
                    <h2 id="subtopics-title">Subtopics</h2>
                    <form id="create-subtopic-form" class="modern-form">
                        <input type="text" id="new-subtopic-name" placeholder="Create a subtopic..." required class="modern-input">
                        <button type="submit" class="primary-btn">+</button>
                    </form>
                </div>
                <div id="subtopics-list" class="grid"></div>
            </section>

            <!-- Info-Cards View -->
            <section id="infocards-view" class="view-section hidden">
                <div class="section-header">
                    <h2 id="infocards-title">Info-Cards</h2>
                </div>
                <div class="create-card-container glass-box">
                    <form id="create-infocard-form">
                        <textarea id="new-infocard-content" placeholder="Share a historical fact, lore, or information..." required class="modern-textarea"></textarea>
                        <button type="submit" class="primary-btn mt-10">Post Info-Card</button>
                    </form>
                </div>
                <div id="infocards-list" class="cards-grid"></div>
            </section>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="glass-box modal-box">
            <h2>Settings</h2>
            <label>Username:</label>
            <input type="text" id="settings-username" class="modern-input">
            <label class="color-label">Theme Color:</label>
            <input type="color" id="settings-color" class="modern-color-picker">
            <div class="modal-actions">
                <button id="settings-save-btn" class="primary-btn">Save Changes</button>
                <button id="settings-cancel-btn" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Main App Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
