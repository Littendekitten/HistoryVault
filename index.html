<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HistoryVault - By KitaCat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Auth Screen (Visible when logged out) -->
    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h1>🏛️ HistoryVault</h1>
            <p>A wiki for history (By KitaCat)</p>
            <button id="login-btn" class="primary-btn">Login / Sign Up with Google</button>
        </div>
    </div>

    <!-- First Time Setup Screen -->
    <div id="setup-screen" class="screen hidden">
        <div class="modal-box">
            <h2>Welcome to HistoryVault!</h2>
            <p>Please choose a username and your favorite theme color.</p>
            <input type="text" id="setup-username" placeholder="Enter username...">
            <label for="setup-color">Theme Color:</label>
            <input type="color" id="setup-color" value="#4CAF50">
            <button id="setup-save-btn" class="primary-btn">Complete Setup</button>
        </div>
    </div>

    <!-- Main App Screen (Visible when logged in) -->
    <div id="app-screen" class="screen hidden">
        <header>
            <div class="header-left">
                <h1>🏛️ HistoryVault</h1>
                <span class="credit">By KitaCat</span>
            </div>
            <div class="header-right">
                <span id="user-display"></span>
                <button id="settings-btn">⚙️ Settings</button>
                <button id="logout-btn">Logout</button>
            </div>
        </header>

        <main>
            <!-- Topics Section -->
            <section id="topics-section">
                <div class="section-header">
                    <h2>History Topics</h2>
                    <form id="create-topic-form">
                        <input type="text" id="new-topic-name" placeholder="E.g., Ancient Rome, Minecraft History..." required>
                        <button type="submit">Create Topic</button>
                    </form>
                </div>
                <div id="topics-list" class="grid">
                    <!-- Topics will load here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-box">
            <h2>Settings</h2>
            <label for="settings-username">Username:</label>
            <input type="text" id="settings-username">
            <label for="settings-color">Theme Color:</label>
            <input type="color" id="settings-color">
            <div class="modal-actions">
                <button id="settings-save-btn" class="primary-btn">Save</button>
                <button id="settings-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Main App Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
